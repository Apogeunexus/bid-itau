<!doctype html>
<meta charset="utf-8" />
<title>Carga de teste — saldo</title>
<meta name="robots" content="noindex" />
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0b0b0b; color: #f5f5f5; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 34rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: #b9b9b9; margin: .25rem 0; }
  code { color: #ff8a3d; }
  a { display: inline-block; margin-top: 1.5rem; padding: .75rem 1.5rem; border-radius: 999px;
      background: #ff6a00; color: #111; font-weight: 700; text-decoration: none; }
</style>
<main>
  <h1 id="titulo">Carregando o saldo de teste…</h1>
  <p id="detalhe">Escrevendo no armazenamento deste navegador.</p>
  <a id="ir" href="/descobrir/" hidden>Ir para o app</a>
</main>
<script>
  // FERRAMENTA DE TESTE, NÃO PRODUTO. Ela existe para pôr um saldo na carteira sem pedir
  // que alguém cole JavaScript no console — o que é um jeito ruim de entregar qualquer
  // coisa. Escreve a MESMA chave e o MESMO envelope que `contexto/pontos.tsx` lê
  // (`{versao, estado}`); qualquer divergência aí faz a leitura devolver undefined em
  // silêncio e a tela nascer zerada, que foi exatamente o que aconteceu antes.
  fetch("/saldo-de-teste.json")
    .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then((j) => {
      localStorage.setItem(j.chave, JSON.stringify(j.guardado));
      var fichas = j.guardado.estado.livro
        .filter(function (l) { return l.ativo === "ficha"; })
        .reduce(function (a, l) { return a + (l.sentido === "credito" ? l.valor : -l.valor); }, 0);
      document.getElementById("titulo").textContent = fichas + " fichas na carteira";
      document.getElementById("detalhe").innerHTML =
        'Pronto. A mais barata é <code>Ingresso para exposição</code>, por 90 fichas.';
      document.getElementById("ir").hidden = false;
    })
    .catch(function (e) {
      // FALHA DECLARADA, NÃO ENGOLIDA: em janela privada o localStorage recusa, e sem
      // esta mensagem a pessoa voltaria ao app achando que carregou.
      document.getElementById("titulo").textContent = "Não consegui carregar";
      document.getElementById("detalhe").textContent =
        "Motivo: " + e.message + ". Em janela anônima o navegador bloqueia o armazenamento.";
    });
</script>
